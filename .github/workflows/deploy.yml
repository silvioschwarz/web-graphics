name: Deploy Web Graphics Subsites to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build subsites into combined dist/
        run: |
          mkdir -p dist/first-try dist/shark

          # Build first-try
          npm --prefix first-try ci
          npm --prefix first-try run build
          cp -r first-try/dist/* dist/first-try/

          # Build shark
          npm --prefix shark ci
          npm --prefix shark run build
          cp -r shark/dist/* dist/shark/

          # Root index page linking to both subsites
          cat << 'EOF' > dist/index.html
          <!doctype html>
          <html lang="de">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Web Graphics</title>
              <style>
                body { font-family: system-ui, sans-serif; padding: 2rem; background: #0f172a; color: #f8fafc; }
                a { color: #38bdf8; font-size: 1.2rem; display: block; margin: 0.75rem 0; }
              </style>
            </head>
            <body>
              <h1>Web Graphics</h1>
              <a href="./first-try/">First Try</a>
              <a href="./shark/">Three.js Hai-Spirale (Shark)</a>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
