name: Deploy Multiple Webgraphics

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Erstelle einen temporären Ordner, der alle fertigen Webseiten sammelt
      - name: Create Deployment Directory
        run: mkdir -p dist-all

      # 2. PROJEKT 1: Hai-Spirale bauen und kopieren
      - name: Build Project 1 (Hai Spirale)
        run: |
          cd shark
          npm ci
          npm run build
          cd ..
          mkdir -p dist-all/shark
          cp -r shark/dist/* dist-all/shark/ # Passe 'dist' an, falls der Ausgabeordner anders heißt

#      # 3. PROJEKT 2: MPC-Sampler bauen und kopieren
#      - name: Build Project 2 (MPC Sampler)
#        run: |
#          cd mpc-sampler
#          npm ci
#          npm run build
#          cd ..
#          mkdir -p dist-all/mpc-sampler
#          cp -r mpc-sampler/dist/* dist-all/mpc-sampler/

      # 4. GitHub Pages vorbereiten und den kombinierten Ordner hochladen
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist-all' # Lädt den gesamten Sammelordner hoch

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

